data:
  part_dirs:
  - ore_photos_by_grade_part1
  - ore_photos_by_grade_part2
  panoramas_dir: panoramas
  class_dirs:
    normal:
    - run_of_mine
    fine:
    - fine_grained
    - refractory
  ignore_dirs:
  - talc
  holdout_fraction: 0.15
  microns_per_pixel: null
  preprocess:
    illumination: anchor
    illumination_downscale: 8
    illumination_sigma: 65
    denoise: median
    denoise_h: 5
    clahe_clip: 0.0
  limit_per_class: null
  pseudo:
    t_strong: 125
    t_weak: 80
    open_kernel: 3
    min_area_px: 64
  tiles:
    size: 256
    stride: 320
    min_sulfide_frac: 0.03
model:
  segmenter:
    name: resnet_unet
    encoder: resnet34
    pretrained: true
    in_channels: 3
    out_channels: 1
  classifier:
    name: convnext_tile
    backbone: convnext_tiny
    pretrained: false
    num_classes: 2
    dropout: 0.1
seed: 42
device: cpu
paths:
  data_root: ../../data
  derived: run/outputs/smoke
  outputs: run/outputs
  weights: run/outputs/smoke/weights
train_segmenter:
  epochs: 25
  batch_size: 16
  lr: 0.0003
  weight_decay: 0.0001
  num_workers: 8
  amp: true
  max_tiles_per_image: 6
  val_fraction: 0.1
train_classifier:
  epochs: 2
  batch_size: 4
  lr: 0.0001
  backbone_lr_mult: 0.1
  weight_decay: 0.05
  label_smoothing: 0.05
  num_workers: 0
  amp: false
  val_fraction: 0.15
  tiles_per_image: 2
  tta: false
infer:
  seg_tile: 1024
  seg_stride: 768
  cls_tile: 448
  cls_stride: 224
  seg_threshold: 0.5
  min_component_px: 96
  smooth_components_below_px: 20000
  overlay_alpha: 0.45
  batch_size: 16
  use_unet: true
