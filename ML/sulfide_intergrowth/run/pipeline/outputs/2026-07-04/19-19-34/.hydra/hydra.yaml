hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - paths.derived=run/outputs/smoke
    - paths.weights=run/outputs/smoke/weights
    - paths.outputs=run/outputs/smoke
    - model.segmenter.encoder=resnet18
    - model.segmenter.pretrained=false
    - model.classifier.backbone=convnext_tiny
    - model.classifier.pretrained=false
    - infer.seg_tile=512
    - infer.seg_stride=384
    - infer.cls_tile=256
    - infer.cls_stride=128
    - infer.batch_size=2
    - infer.use_unet=false
    - device=cpu
    - +input=/private/tmp/claude-501/-Users-den1shh-Documents-nornickel/16424ba1-ef43-4172-b5c2-002d483cd215/scratchpad/pano_crop.jpg
  job:
    name: infer_panorama
    chdir: false
    override_dirname: +input=/private/tmp/claude-501/-Users-den1shh-Documents-nornickel/16424ba1-ef43-4172-b5c2-002d483cd215/scratchpad/pano_crop.jpg,device=cpu,infer.batch_size=2,infer.cls_stride=128,infer.cls_tile=256,infer.seg_stride=384,infer.seg_tile=512,infer.use_unet=false,model.classifier.backbone=convnext_tiny,model.classifier.pretrained=false,model.segmenter.encoder=resnet18,model.segmenter.pretrained=false,paths.derived=run/outputs/smoke,paths.outputs=run/outputs/smoke,paths.weights=run/outputs/smoke/weights
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.3
    version_base: '1.3'
    cwd: /Users/den1shh/Documents/nornickel/miners/ML/sulfide_intergrowth/run/pipeline
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /Users/den1shh/Documents/nornickel/miners/ML/sulfide_intergrowth/run/conf
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /Users/den1shh/Documents/nornickel/miners/ML/sulfide_intergrowth/run/pipeline/outputs/2026-07-04/19-19-34
    choices:
      model: default
      data: default
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
