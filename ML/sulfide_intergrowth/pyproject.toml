[project]
name = "sulfide-intergrowth"
version = "0.1.0"
description = "Segmentation + intergrowth-type classification of sulfides on panoramic reflected-light OM images of polished sections"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "opencv-python-headless>=4.8",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "albumentations>=1.4",
    "tqdm>=4.66",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.9"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools]
packages = { find = { where = ["."], include = ["src*"] } }
