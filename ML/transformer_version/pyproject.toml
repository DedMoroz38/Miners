[project]
name = "orenet"
version = "0.1.0"
description = "OM polished-section ore classification: phase segmentation + intergrowth analysis"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "transformers>=4.40",
    "albumentations>=1.4",
    "opencv-python-headless>=4.9",
    "scikit-image>=0.22",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
